name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cleanmarket-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-7180b607-0de7-493c-969
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: cleanmarket-api
  IMAGE_URI: asia-southeast1-docker.pkg.dev/project-7180b607-0de7-493c-969/cloud-run-source-deploy/cleanmarket-api
  FIREBASE_PROJECT_ID: project-7180b607-0de7-493c-969

jobs:
  test-build-deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Build backend container
        run: docker build --tag "${IMAGE_URI}:${GITHUB_SHA}" backend

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.31.0

      - id: auth-backend
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Push backend container
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "${IMAGE_URI}:${GITHUB_SHA}"

      - id: deploy-backend
        name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE_URI }}:${{ github.sha }}

      # GitHub OIDC credentials are short lived. Refresh immediately before
      # Firebase Hosting deploys and pins /api/** to the new Cloud Run revision.
      - id: auth-hosting
        name: Refresh Google Cloud authentication
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy frontend to Firebase Hosting
        run: firebase deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --non-interactive --force

      - name: Smoke test production
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "https://cleanmarket.io.vn/api/products?page=0&size=1" > /dev/null
