server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Firebase Hosting only forwards this specially named cookie to Cloud Run.
server.servlet.session.cookie.name=__session
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0

# Production databases already contain migrations through V5. Flyway records that
# baseline once, then applies every newer versioned migration before JPA validates.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5s

management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
