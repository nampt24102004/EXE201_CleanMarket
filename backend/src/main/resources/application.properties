spring.application.name=cleanmarket-backend
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cleanmarket_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

app.demo.seed=${DEMO_SEED:false}
# SMTP email
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}
app.mail.from-email=${SMTP_FROM_EMAIL:}
app.mail.from-name=${SMTP_FROM_NAME:CleanMarket}
app.mail.delivery-enabled=${MAIL_DELIVERY_ENABLED:true}
app.mail.support-email=${MAIL_SUPPORT_EMAIL:${SMTP_FROM_EMAIL:}}
app.mail.logo-url=${MAIL_LOGO_URL:}
app.mail.otp-ttl-minutes=${MAIL_OTP_TTL_MINUTES:5}
app.mail.otp-resend-seconds=${MAIL_OTP_RESEND_SECONDS:60}
app.mail.otp-max-attempts=${MAIL_OTP_MAX_ATTEMPTS:5}
app.mail.reset-ttl-minutes=${MAIL_RESET_TTL_MINUTES:15}
app.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}
app.google.client-id=${GOOGLE_CLIENT_ID:}

# payOS (secrets come from environment variables or backend/.env)
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}
app.payos.link-ttl-seconds=${PAYOS_LINK_TTL_SECONDS:900}
# Cloudflare R2 private object storage
app.storage.provider=${STORAGE_PROVIDER:r2}
# STORAGE_PROVIDER=local keeps uploads on this machine (development only).
app.storage.local-dir=${STORAGE_LOCAL_DIR:uploads}
app.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.region=${STORAGE_REGION:auto}
app.storage.access-key-id=${STORAGE_ACCESS_KEY_ID:${R2_ACCESS_KEY_ID:}}
app.storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:${R2_SECRET_ACCESS_KEY:}}
app.storage.bucket=${STORAGE_BUCKET:${R2_BUCKET:}}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:${R2_PUBLIC_BASE_URL:}}
app.storage.signer-service-account=${STORAGE_SIGNER_SERVICE_ACCOUNT:}
app.r2.read-url-ttl-seconds=${R2_PRESIGNED_GET_TTL_SECONDS:900}
app.upload.max-file-size-mb=${UPLOAD_MAX_FILE_SIZE_MB:10}
app.upload.max-files=${UPLOAD_MAX_FILES:8}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=80MB
